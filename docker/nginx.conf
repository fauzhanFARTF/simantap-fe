server {
    # Port >1024 supaya nginx bisa jalan penuh sebagai user non-root di dalam
    # container (bind port <1024 butuh privilese yang sengaja tidak diberikan).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker bawaan -- dipakai karena proxy_pass di bawah memakai variabel,
    # supaya nginx tidak gagal start kalau container backend belum siap saat
    # nginx pertama kali jalan (resolusi ditunda ke saat request masuk).
    resolver 127.0.0.11 valid=30s;
    set $backend "http://backend:8000";

    location /api/ {
        # PENTING: proxy_pass dengan variabel TIDAK melakukan penggantian
        # prefix lokasi otomatis (beda dari proxy_pass statis) -- tanpa
        # $request_uri di sini, nginx selalu mengirim string "/api/" polos ke
        # backend, membuang seluruh sisa path (health/, auth/config/, dst).
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Backend menolak (400) atau me-redirect-loop tanpa header ini --
        # TLS sudah diterminasi di Apache/Cloudflare di depan nginx ini.
        proxy_set_header X-Forwarded-Proto "https";
    }

    # Foto alat/user -- disajikan langsung dari volume bersama dengan backend,
    # tidak lewat Python (backend TIDAK melayani /uploads/ saat DEBUG=False).
    location /uploads/ {
        alias /uploads/;
        add_header Cache-Control "public, max-age=604800";
    }

    # Aset hasil build (hash di nama file) aman di-cache lama.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history mode: rute yang tidak cocok berkas jatuh ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

